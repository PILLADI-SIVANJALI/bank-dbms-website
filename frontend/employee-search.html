<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Search - Smart Digital Bank</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

    <style>

        /* =================================
           PAGE
        ================================= */

        .employee-page {

            width: 94%;

            margin: 40px auto;

        }


        /* =================================
           HEADER
        ================================= */

        .employee-page-header {

            text-align: center;

            margin-bottom: 35px;

        }


        .employee-page-header h1 {

            font-size: 38px;

            margin-bottom: 10px;

        }


        .employee-page-header p {

            font-size: 18px;

            margin: 0;

        }


        .employee-page-header i {

            color: #00d9ff;

            margin-right: 12px;

        }


        /* =================================
           SEARCH CARD
        ================================= */

        .search-card {

            background: rgba(255,255,255,0.10);

            border-radius: 20px;

            padding: 30px;

            max-width: 900px;

            margin: auto;

        }


        .search-row {

            display: flex;

            gap: 15px;

            flex-wrap: wrap;

            justify-content: center;

        }


        select,
        input {

            padding: 14px;

            border-radius: 10px;

            border: none;

            font-size: 16px;

            outline: none;

        }


        select {

            min-width: 200px;

        }


        input {

            min-width: 300px;

        }


        .search-btn {

            padding: 14px 25px;

            border: none;

            border-radius: 10px;

            background: #00d9ff;

            color: #061a2d;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        .search-btn:hover {

            opacity: 0.85;

        }


        /* =================================
           RESULTS
        ================================= */

        .result-card {

            background: rgba(255,255,255,0.10);

            border-radius: 20px;

            padding: 25px;

            margin-top: 30px;

            overflow-x: auto;

        }


        table {

            width: 100%;

            border-collapse: collapse;

        }


        th {

            color: #00d9ff;

            font-size: 16px;

            padding: 16px;

            text-align: left;

            border-bottom:
                1px solid
                rgba(255,255,255,0.25);

        }


        td {

            color: white;

            padding: 16px;

            border-bottom:
                1px solid
                rgba(255,255,255,0.12);

        }


        tr:hover {

            background:
                rgba(255,255,255,0.08);

        }


        #message {

            text-align: center;

            color: white;

            font-size: 18px;

            padding: 20px;

        }


        /* =================================
           BACK BUTTON
        ================================= */

        .back-btn {

            display: inline-block;

            margin-top: 30px;

            padding: 12px 25px;

            background: rgba(255,255,255,0.12);

            color: white;

            text-decoration: none;

            border-radius: 10px;

            transition: 0.3s;

        }


        .back-btn:hover {

            background:
                rgba(255,255,255,0.20);

        }


        /* =================================
           MOBILE
        ================================= */

        @media(max-width: 700px) {

            .employee-page-header h1 {

                font-size: 30px;

            }


            input,
            select {

                width: 100%;

                min-width: 0;

            }


            .search-btn {

                width: 100%;

            }

        }

    </style>

</head>


<body>


<!-- =================================
     NAVBAR
================================= -->

<header class="navbar">

    <div class="logo">

        <i class="fa-solid fa-building-columns"></i>

        Smart Digital Bank

    </div>


    <nav>

        <a href="employee-dashboard.html">
            Home
        </a>

        <a href="employee-login.html">
            Logout
        </a>

    </nav>

</header>



<!-- =================================
     SEARCH PAGE
================================= -->

<div class="employee-page">


    <!-- HEADER -->

    <div class="employee-page-header">

        <h1>

            <i class="fa-solid fa-magnifying-glass"></i>

            Search Bank Records

        </h1>


        <p>

            Search customers and accounts

        </p>

    </div>



    <!-- SEARCH BOX -->

    <div class="search-card">

        <div class="search-row">


            <select id="searchType">

                <option value="customer_id">
                    Customer ID
                </option>

                <option value="customer_name">
                    Customer Name
                </option>

                <option value="account_no">
                    Account Number
                </option>

            </select>


            <input
                type="text"
                id="searchInput"
                placeholder="Enter search value"
            >


            <button
                class="search-btn"
                onclick="searchRecords()"
            >

                <i class="fa-solid fa-search"></i>

                Search

            </button>


        </div>

    </div>



    <!-- RESULTS -->

    <div
        class="result-card"
        id="resultCard"
        style="display:none;"
    >

        <div id="message"></div>


        <table
            id="resultTable"
            style="display:none;"
        >

            <thead id="resultHead"></thead>

            <tbody id="resultBody"></tbody>

        </table>

    </div>



    <!-- BACK -->

    <a
        href="employee-dashboard.html"
        class="back-btn"
    >

        ← Back to Dashboard

    </a>


</div>



<script>


const API_BASE_URL =
    "http://127.0.0.1:5000";



async function searchRecords() {


    const searchType =
        document.getElementById(
            "searchType"
        ).value;


    const searchInput =
        document.getElementById(
            "searchInput"
        ).value.trim();


    const resultCard =
        document.getElementById(
            "resultCard"
        );


    const message =
        document.getElementById(
            "message"
        );


    const table =
        document.getElementById(
            "resultTable"
        );


    const head =
        document.getElementById(
            "resultHead"
        );


    const body =
        document.getElementById(
            "resultBody"
        );


    resultCard.style.display =
        "block";


    table.style.display =
        "none";


    message.textContent =
        "Searching...";


    head.innerHTML = "";

    body.innerHTML = "";


    if (!searchInput) {

        message.textContent =
            "Please enter a search value.";

        return;

    }


    try {


        const response =
            await fetch(

                API_BASE_URL +
                "/employee/search?type=" +
                encodeURIComponent(searchType) +
                "&query=" +
                encodeURIComponent(searchInput)

            );


        const results =
            await response.json();


        if (!response.ok) {

            throw new Error(
                "Search failed"
            );

        }


        if (results.length === 0) {

            message.textContent =
                "No records found.";

            return;

        }


        message.style.display =
            "none";


        table.style.display =
            "table";


        /* =================================
           CUSTOMER SEARCH
        ================================= */

        if (
            searchType === "customer_id" ||
            searchType === "customer_name"
        ) {


            head.innerHTML = `

                <tr>

                    <th>Customer ID</th>

                    <th>Name</th>

                    <th>Gender</th>

                    <th>Phone</th>

                    <th>Email</th>

                    <th>Account No</th>

                    <th>Account Type</th>

                    <th>Balance</th>

                </tr>

            `;


            results.forEach(result => {

                body.innerHTML += `

                    <tr>

                        <td>
                            ${result.Customer_ID}
                        </td>

                        <td>
                            ${result.Name}
                        </td>

                        <td>
                            ${result.Gender}
                        </td>

                        <td>
                            ${result.Phone}
                        </td>

                        <td>
                            ${result.Email}
                        </td>

                        <td>
                            ${result.Account_No ?? "-"}
                        </td>

                        <td>
                            ${result.Account_Type ?? "-"}
                        </td>

                        <td>
                            ₹${result.Balance ?? 0}
                        </td>

                    </tr>

                `;

            });

        }



        /* =================================
           ACCOUNT SEARCH
        ================================= */

        else if (
            searchType === "account_no"
        ) {


            head.innerHTML = `

                <tr>

                    <th>Account No</th>

                    <th>Customer ID</th>

                    <th>Customer Name</th>

                    <th>Branch</th>

                    <th>Account Type</th>

                    <th>Balance</th>

                    <th>Open Date</th>

                </tr>

            `;


            results.forEach(result => {

                body.innerHTML += `

                    <tr>

                        <td>
                            ${result.Account_No}
                        </td>

                        <td>
                            ${result.Customer_ID}
                        </td>

                        <td>
                            ${result.Customer_Name}
                        </td>

                        <td>
                            ${result.Branch_Name}
                        </td>

                        <td>
                            ${result.Account_Type}
                        </td>

                        <td>
                            ₹${result.Balance}
                        </td>

                        <td>
                            ${result.Open_Date}
                        </td>

                    </tr>

                `;

            });

        }


    }


    catch (error) {

        console.log(error);

        message.style.display =
            "block";

        message.textContent =
            "Unable to search bank records.";

    }

}

</script>


</body>

</html>
